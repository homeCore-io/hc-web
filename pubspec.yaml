name: hc_web
description: HomeCore web dashboard
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^13.2.0
  shared_preferences: ^2.2.2
  web_socket_channel: ^2.4.0
  fl_chart: ^0.67.0
  timeago: ^3.6.1
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  # EventSource, for streaming plugin actions. Dio's browser adapter buffers the
  # whole response, so it cannot carry SSE; core accepts `?token=` on that path
  # precisely because EventSource cannot set an Authorization header.
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.4.0
  freezed: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
