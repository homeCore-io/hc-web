name: hc_web
description: HomeCore web dashboard
publish_to: 'none'
# Kept in step with the rest of homeCore (core 0.1.x, plugins 0.1.x, and the
# docker repo's tags), and with the git tag this repo is released from — the
# release workflow publishes ghcr.io/homecore-io/hc-web:<version> from `v<version>`.
# It read 1.0.0+1 from `flutter create` and had never been touched, which would
# have made the first release's image tag disagree with the app it contains.
version: 0.1.56+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  flutter_riverpod: ^3.0.0
  go_router: ^17.0.0
  shared_preferences: ^2.2.2
  web_socket_channel: ^3.0.0
  fl_chart: ^1.2.0
  timeago: ^3.6.1
  json_annotation: ^4.9.0
  # EventSource, for streaming plugin actions. Dio's browser adapter buffers the
  # whole response, so it cannot carry SSE; core accepts `?token=` on that path
  # precisely because EventSource cannot set an Authorization header.
  web: ^1.1.0
  archive: ^4.0.9
  xml: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Lets the plugin-poll test elapse its 10s timer without the suite waiting.
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/

  # Phosphor icons, used straight from the fonts. We do NOT depend on
  # phosphor_flutter: it does not compile on Flutter 3.44, where IconData became
  # a `final class` and the package declares `PhosphorIconData extends IconData`.
  # Two families give us the weight axis we picked Phosphor for — outline when a
  # device is off, solid when it is on. MIT; see assets/fonts/PHOSPHOR-LICENSE.
  fonts:
    - family: Phosphor
      fonts:
        - asset: assets/fonts/Phosphor.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/Phosphor-Fill.ttf

    # Text, finally. Until now nothing declared a text face at all, so the app
    # rendered in whatever CanvasKit had — and glyph fallback resolved against
    # fonts.gstatic.com, which is a request out of a house that is supposed to
    # work with no route out.
    #
    # Inter because ~660 of this app's type sites sit between 11 and 14px, and
    # the two ends the skin scale creates are a 9.2px tracked overline in
    # Control Room and body read across a dark room at ~15px in Ambient Glass.
    # A tall x-height and open apertures are what survive both. It also carries
    # real `tnum` in every weight — verified, not assumed — which is the whole
    # mechanism behind `numericFontFeatures` and the reason a ticking
    # temperature does not reflow the layout.
    #
    # Statics rather than InterVariable (860KB, would have covered 100–900 in
    # one file): 170 sites call `copyWith(fontWeight:)`, which does not drive a
    # variable `wght` axis, so the weight would have been silently ignored at
    # every one of them. 2MB of cached TTF against a 4.6MB main.dart.js and a
    # 7MB canvaskit.wasm is the cheaper mistake to avoid.
    #
    # OFL; see assets/fonts/INTER-LICENSE.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800

    # The 42 monospace sites — config editors, JSON, log tails, device IDs —
    # were asking for `'monospace'` and getting whatever the browser called
    # that, which is a different face on the phone than on the wall panel.
    #
    # The NL cut, with no code ligatures: these are log lines and device IDs
    # read for their exact characters, and `->` quietly becoming an arrow is the
    # wrong favour in a tool you reach for when something is wrong. Weights are
    # the three the mono roles actually request (400 body/bodySmall, 500
    # caption, 600 subtitle/title).
    #
    # It carries no `tnum`, which is correct rather than missing: a monospaced
    # face has fixed-advance digits by construction, so tabularFigures() is a
    # no-op there.
    #
    # OFL; see assets/fonts/JETBRAINS-MONO-LICENSE.
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
